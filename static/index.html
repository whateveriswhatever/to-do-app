<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    .input-container { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 14px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .delete-btn { background: #e63946; }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0f4f8;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .logout-btn { background: #6c757d; font-size: 13px; padding: 6px 10px; }
  </style>
</head>
<body>
  <div id="user">

  </div>
  <h2>To-Do List</h2>
  <div class="input-container">
    <input type="text" id="taskInput" placeholder="Add a task...">
    <input type="number" id="priorityInput" placeholder="Priority" style="flex: 0.3;"/>
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="taskList"></ul>

  <script>
    const API = '/api/tasks';

    async function fetchUser() {
      try {
        const res = await fetch("/api/users/me");
        if (res.ok) {
          const user = await res.json();
          const displayName = user.firstname ? `${user.firstname} ${user.lastname}` : user["username"];
          document.getElementById("user").innerHTML = `
            <div class="user-bar">
              <span>
                <strong>${displayName}</strong>
              </span>
              <button class="logout-btn" onclick="logout()">Log out</button>
            </div>
          `;
        }
      } catch (err) {
        console.error(`Can't retrieve the user information! ${err}`);
      }
    }

    async function fetchTasks() {
      const res = await fetch(API);
      const data = await res.json();
      const list = document.getElementById('taskList');
      list.innerHTML = data.map(t => `
        <li>
          <span>${t.content}</span>
          <button class="delete-btn" onclick="deleteTask(${t.id})">Delete</button>
        </li>
      `).join('');
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const priorityInput = document.getElementById("priorityInput");

      if (!input.value.trim()) return;
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(
          { content: input.value.trim(),
            order_priority: parseInt(priorityInput.value) || 0,
            is_done: 0
          }
        )
      });
      input.value = '';
      priorityInput.value = "";
      fetchTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    async function logout() {
      await fetch("/api/users/logout", {method: "POST"});
      window.location.href = "/login";
    }

    fetchUser();
    fetchTasks();
  </script>
</body>
</html>
